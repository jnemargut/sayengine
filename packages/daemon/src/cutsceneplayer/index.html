<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cutscene preview</title>
<style>
  :root { --bg: #f4f1ec; --ink: #1c1917; --muted: #6b645c; --line: #ddd6cc; --card: #fffdf9; --accent: #7a4a2c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1916; --ink: #f2ede6; --muted: #a39a8f; --line: #3a352f; --card: #24211d; --accent: #d8a77c; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Source Sans 3", system-ui, sans-serif; }
  main { max-width: 1320px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: var(--muted); }
  #stage canvas { width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid var(--line); }
  .bar { display: flex; gap: 16px; align-items: center; margin-top: 12px; }
  button { padding: 8px 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #caption { color: var(--muted); }
  .capture main { padding: 0; max-width: none; }
  .capture h1, .capture p.sub, .capture .bar { display: none; }
  .capture #stage canvas { border: 0; border-radius: 0; }
</style>
</head>
<body>
<main>
  <h1 id="title">Cutscene preview</h1>
  <p class="sub">The same player web games use: characters idle until their cue, perform their lines with the whole body, and the camera follows the shots.</p>
  <div id="stage"></div>
  <div class="bar"><button id="play">Play with sound</button><span id="caption"></span></div>
</main>
<script>
  if (new URLSearchParams(location.search).has('capture')) document.documentElement.classList.add('capture');
  fetch('cutscene.json').then((r) => r.json()).then((c) => { document.getElementById('title').textContent = c.title || c.id; document.title = c.title || c.id; });
</script>
<script type="module" src="player.js"></script>
</body>
</html>
